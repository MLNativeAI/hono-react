name: Tests

on:
  workflow_call:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Setup Node.js environment
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install dependencies
      run: bun install

    - name: Compile translations
      run: bun run paraglide:compile

    - name: Run unit tests with coverage thresholds
      run: bun run test:coverage

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: coverage-reports
        path: "**/coverage/**"
        if-no-files-found: error

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Postgres service container the integration suite migrates against.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Point the suite at the service container (host port mapped above).
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/app_test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Setup Node.js environment
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install dependencies
      run: bun install

    - name: Run integration tests
      run: bun run test:integration

  e2e:
    name: Browser E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      API_BASE_URL: http://localhost:3000
      DASHBOARD_BASE_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_e2e
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: test-access-key
      S3_SECRET_KEY: test-secret-key
      S3_BUCKET: test-bucket
      BETTER_AUTH_SECRET: test-secret-that-is-at-least-32-chars-long
      RESEND_API_KEY: ""
      FROM_EMAIL: test@example.com
      ENVIRONMENT: dev
      ENABLE_TEST_UTILS: "1"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install Chromium
      run: bunx playwright install --with-deps chromium

    - name: Start API
      run: |
        bun apps/api/src/index.ts > /tmp/api.log 2>&1 &
        for attempt in {1..30}; do
          curl --fail --silent http://127.0.0.1:3000/api/health && exit 0
          sleep 1
        done
        cat /tmp/api.log
        exit 1

    - name: Run browser tests
      run: bun run test:e2e

    - name: Upload browser test artifacts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: playwright-report
        path: tests/e2e/playwright-report
        if-no-files-found: ignore
